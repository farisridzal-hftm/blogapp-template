<mat-card class="login-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>lock</mat-icon>
    <mat-card-title>Anmelden</mat-card-title>
    <mat-card-subtitle>Die Anmeldung laeuft ueber Keycloak</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (errorMessage(); as message) {
      <p class="login-error" role="alert">
        <mat-icon>error_outline</mat-icon>
        {{ message }}
      </p>
    }

    <p>
      Du wirst zur Login-Seite von Keycloak weitergeleitet. Nach der Anmeldung kehrst du automatisch
      zurueck.
    </p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-flat-button type="button" (click)="login()">
      <mat-icon>login</mat-icon>
      Mit Keycloak anmelden
    </button>
  </mat-card-actions>
</mat-card>
