<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ isEdit() ? 'Blog bearbeiten' : 'Neuer Blog' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill">
        <mat-label>Titel</mat-label>
        <input matInput formControlName="title" />
        <mat-error>Titel ist erforderlich.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Autor</mat-label>
        <input matInput formControlName="author" />
        <mat-error>Autor ist erforderlich.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Inhalt</mat-label>
        <textarea matInput rows="6" formControlName="contentPreview"></textarea>
        <mat-error>Inhalt ist erforderlich.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Header-Bild-URL (optional)</mat-label>
        <input matInput formControlName="headerImageUrl" />
      </mat-form-field>

      <div class="actions">
        <button mat-button type="button" (click)="cancel()">Abbrechen</button>
        <button mat-flat-button type="submit" [disabled]="saving()">
          {{ isEdit() ? 'Speichern' : 'Erstellen' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
