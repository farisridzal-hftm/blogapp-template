<ng-template #navigation>
  <nav class="nav" aria-label="Hauptnavigation">
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >
      <mat-icon>article</mat-icon>
      Blog
    </a>

    <a mat-button routerLink="/about" routerLinkActive="active-link" (click)="closeMenu()">
      <mat-icon>info</mat-icon>
      About
    </a>

    @if (auth.enabled && !auth.loading()) {
      @if (auth.isAuthenticated()) {
        <span class="user-name" [matTooltip]="auth.user()?.email ?? ''">
          <mat-icon>account_circle</mat-icon>
          {{ auth.user()?.preferred_username }}
        </span>

        <button mat-button type="button" (click)="auth.logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      } @else {
        <a mat-button routerLink="/login" routerLinkActive="active-link" (click)="closeMenu()">
          <mat-icon>login</mat-icon>
          Login
        </a>
      }
    }
  </nav>
</ng-template>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    class="sidenav"
    fixedInViewport
    mode="over"
    role="dialog"
    aria-label="Menu"
    [opened]="isMobile() && menuOpen()"
    (openedChange)="menuOpen.set($event)"
  >
    <mat-toolbar class="sidenav-toolbar">Menu</mat-toolbar>

    @if (isMobile()) {
      <ng-container [ngTemplateOutlet]="navigation" />
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      @if (isMobile()) {
        <button
          type="button"
          matIconButton
          aria-label="Navigation ein-/ausblenden"
          [attr.aria-expanded]="menuOpen()"
          (click)="menuOpen.set(!menuOpen())"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }

      <mat-icon class="brand-icon">rss_feed</mat-icon>
      <span class="title">{{ title }}</span>

      <span class="spacer"></span>

      @if (!isMobile()) {
        <ng-container [ngTemplateOutlet]="navigation" />
      }

      <button
        matIconButton
        type="button"
        (click)="theme.cycle()"
        [attr.aria-label]="'Theme umschalten (aktuell: ' + theme.label() + ')'"
        [matTooltip]="'Theme: ' + theme.label()"
      >
        <mat-icon>{{ theme.icon() }}</mat-icon>
      </button>
    </mat-toolbar>

    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
