<mat-toolbar class="app-toolbar">
  <mat-icon class="brand-icon">rss_feed</mat-icon>
  <span>{{ title }}</span>

  <span class="spacer"></span>

  <nav>
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Blog
    </a>

    <a mat-button routerLink="/about" routerLinkActive="active-link">About</a>
  </nav>

  <button
    mat-icon-button
    type="button"
    (click)="theme.cycle()"
    [attr.aria-label]="'Theme umschalten (aktuell: ' + theme.label() + ')'"
    [matTooltip]="'Theme: ' + theme.label()"
  >
    <mat-icon>{{ theme.icon() }}</mat-icon>
  </button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
