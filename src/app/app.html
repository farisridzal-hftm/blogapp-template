<mat-toolbar class="app-toolbar">
  <mat-icon class="brand-icon">rss_feed</mat-icon>
  <span>{{ title }}</span>

  <span class="spacer"></span>

  <nav>
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Blog
    </a>

    <a mat-button routerLink="/about" routerLinkActive="active-link">About</a>
  </nav>

  @if (auth.enabled && !auth.loading()) {
    @if (auth.isAuthenticated()) {
      <span class="user-name" [matTooltip]="auth.user()?.email ?? ''">
        <mat-icon>account_circle</mat-icon>
        {{ auth.user()?.preferred_username }}
      </span>

      <button mat-button type="button" (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    } @else {
      <a mat-button routerLink="/login" routerLinkActive="active-link">
        <mat-icon>login</mat-icon>
        Login
      </a>
    }
  }

  <button
    mat-icon-button
    type="button"
    (click)="theme.cycle()"
    [attr.aria-label]="'Theme umschalten (aktuell: ' + theme.label() + ')'"
    [matTooltip]="'Theme: ' + theme.label()"
  >
    <mat-icon>{{ theme.icon() }}</mat-icon>
  </button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
